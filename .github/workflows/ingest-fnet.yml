# Sincronização de documentos do FNET (metadados + download de arquivos).
#
# Requer secrets:
#   DATABASE_URL  Postgres (Neon/Supabase)
#   STORAGE_URL   opcional; s3://bucket/prefixo p/ guardar os PDFs (com AWS_* /
#                 S3_ENDPOINT_URL). Sem ele os arquivos não persistem fora do runner,
#                 então só o sync de metadados é útil.
name: Ingestão FNET

on:
  workflow_dispatch:
    inputs:
      tipo_fundo:
        description: "id do tipo de fundo no FNET (vazio = todos)"
        default: ""
      categoria:
        description: "idCategoriaDocumento (vazio = todas)"
        default: ""
      desde:
        description: "data inicial AAAA-MM-DD (vazio = cursor)"
        default: ""
      download_categorias:
        description: "categorias p/ baixar arquivos (vazio = não baixa)"
        default: ""
      download_limite:
        description: "máximo de arquivos por execução"
        default: "200"

jobs:
  fnet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e .[postgres,s3]
      - name: Domínios + sync de metadados
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          python -m ingestor dominios-fnet
          ARGS=""
          [ -n "${{ github.event.inputs.tipo_fundo }}" ] && ARGS="$ARGS --tipo-fundo ${{ github.event.inputs.tipo_fundo }}"
          [ -n "${{ github.event.inputs.categoria }}" ] && ARGS="$ARGS --categoria ${{ github.event.inputs.categoria }}"
          [ -n "${{ github.event.inputs.desde }}" ] && ARGS="$ARGS --desde ${{ github.event.inputs.desde }}"
          python -m ingestor sync-fnet $ARGS
      - name: Download de arquivos
        if: ${{ github.event.inputs.download_categorias != '' }}
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          STORAGE_URL: ${{ secrets.STORAGE_URL }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          S3_ENDPOINT_URL: ${{ secrets.S3_ENDPOINT_URL }}
        run: |
          python -m ingestor download-docs \
            --categorias ${{ github.event.inputs.download_categorias }} \
            --limite ${{ github.event.inputs.download_limite }}
