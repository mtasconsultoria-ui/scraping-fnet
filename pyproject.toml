[project]
name = "fnet-ingestor"
version = "0.1.0"
description = "Ingestão de dados de fundos (CVM Dados Abertos + FundosNET) para filtros e consulta"
requires-python = ">=3.11"
dependencies = [
    "sqlalchemy>=2.0",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
postgres = ["psycopg[binary]>=3.1"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["ingestor"]

[tool.pytest.ini_options]
testpaths = ["tests"]
